<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic Tac Toe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Fira+Mono:wght@400;500&family=Fira+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header class="masthead">
      <h1 class="masthead__title">Tic Tac Toe</h1>
      <div class="masthead__rule"></div>
      <p class="masthead__status" id="status" role="status" aria-live="polite">Your move</p>
    </header>

    <section class="controls" aria-label="Game settings">
      <div class="control">
        <span class="control__label" id="mode-label">Against</span>
        <div class="choices" role="radiogroup" aria-labelledby="mode-label">
          <button type="button" class="choice" role="radio" data-mode="cpu" aria-checked="true">Computer</button>
          <button type="button" class="choice" role="radio" data-mode="human" aria-checked="false">A friend</button>
        </div>
      </div>

      <div class="control" id="difficulty-control">
        <span class="control__label" id="difficulty-label">Level</span>
        <div class="choices" role="radiogroup" aria-labelledby="difficulty-label">
          <button type="button" class="choice" role="radio" data-difficulty="easy" aria-checked="false">Easy</button>
          <button type="button" class="choice" role="radio" data-difficulty="medium" aria-checked="true">Fair</button>
          <button type="button" class="choice" role="radio" data-difficulty="hard" aria-checked="false">Unbeatable</button>
        </div>
      </div>
    </section>

    <div class="board-wrap">
      <svg class="grid-lines" viewBox="0 0 300 300" aria-hidden="true">
        <line x1="100" y1="10" x2="100" y2="290"></line>
        <line x1="200" y1="10" x2="200" y2="290"></line>
        <line x1="10" y1="100" x2="290" y2="100"></line>
        <line x1="10" y1="200" x2="290" y2="200"></line>
      </svg>
      <div class="board" id="board" role="grid" aria-label="Tic tac toe board"></div>
      <svg class="strike" id="strike" viewBox="0 0 300 300" aria-hidden="true"></svg>
    </div>

    <section class="scoreboard" aria-label="Score">
      <div class="score score--x">
        <span class="score__name" id="score-x-name">You</span>
        <span class="score__value" id="score-x">0</span>
      </div>
      <div class="score score--draw">
        <span class="score__name">Draws</span>
        <span class="score__value" id="score-draw">0</span>
      </div>
      <div class="score score--o">
        <span class="score__name" id="score-o-name">Computer</span>
        <span class="score__value" id="score-o">0</span>
      </div>
    </section>

    <div class="actions">
      <button type="button" class="btn btn--primary" id="new-round">New round</button>
      <button type="button" class="btn" id="reset-score">Reset score</button>
    </div>

    <p class="hint">Arrow keys move around the grid, Enter or Space places your mark.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
