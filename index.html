<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic Tac Toe</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1 class="app__title">Tic&nbsp;Tac&nbsp;Toe</h1>
      <p class="app__status" id="status" role="status" aria-live="polite">X to move</p>
    </header>

    <section class="panel" aria-label="Game settings">
      <div class="field">
        <span class="field__label" id="mode-label">Opponent</span>
        <div class="segmented" role="radiogroup" aria-labelledby="mode-label">
          <button type="button" class="segmented__btn" role="radio" data-mode="human" aria-checked="false">2 Players</button>
          <button type="button" class="segmented__btn" role="radio" data-mode="cpu" aria-checked="true">Computer</button>
        </div>
      </div>

      <div class="field" id="difficulty-field">
        <span class="field__label" id="difficulty-label">Difficulty</span>
        <div class="segmented" role="radiogroup" aria-labelledby="difficulty-label">
          <button type="button" class="segmented__btn" role="radio" data-difficulty="easy" aria-checked="false">Easy</button>
          <button type="button" class="segmented__btn" role="radio" data-difficulty="medium" aria-checked="true">Medium</button>
          <button type="button" class="segmented__btn" role="radio" data-difficulty="hard" aria-checked="false">Unbeatable</button>
        </div>
      </div>
    </section>

    <div class="board" id="board" role="grid" aria-label="Tic tac toe board">
      <!-- cells injected by script.js -->
    </div>

    <section class="scoreboard" aria-label="Score">
      <div class="score score--x">
        <span class="score__name" id="score-x-name">X</span>
        <span class="score__value" id="score-x">0</span>
      </div>
      <div class="score score--draw">
        <span class="score__name">Draws</span>
        <span class="score__value" id="score-draw">0</span>
      </div>
      <div class="score score--o">
        <span class="score__name" id="score-o-name">O</span>
        <span class="score__value" id="score-o">0</span>
      </div>
    </section>

    <div class="actions">
      <button type="button" class="btn btn--primary" id="new-round">New round</button>
      <button type="button" class="btn" id="reset-score">Reset score</button>
    </div>

    <p class="hint">Tip: use arrow keys to move around the board, Enter or Space to play.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
